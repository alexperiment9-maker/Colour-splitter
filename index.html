<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Splitter Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1f20">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* VOICE: old-school grading console. Plain, exact, nothing decorative
   IDEA: hardware control surface: labelled rows, numbers, keys
   PICTURE: the frame itself on a neutral grey surround (no colour bias)
   COLOUR and TYPE: neutral greys only, white for active; system monospace (no font download)
   LAYOUT: tool list | monitor + scope | controls. Phone: monitor pinned on top */
:root{color-scheme:dark;--bg:#1e1f20;--p:#262728;--p2:#2e2f31;--ln:#3d3f42;--ink:#dcdcdc;--dim:#8e9093;--hi:#ffffff}
*{box-sizing:border-box;min-width:0;margin:0}
html,body{background:var(--bg);color:var(--ink);font:14px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.b{min-height:40px;padding:0 12px;background:var(--p2);border:1px solid var(--ln);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;white-space:nowrap}
.b:hover{border-color:#5a5d61}
.b[aria-pressed=true],.b.on{background:var(--hi);color:#111;border-color:var(--hi)}
.b:disabled{opacity:.35;cursor:default}
.b input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
kbd{font:inherit;font-size:11px;color:var(--dim);border:1px solid var(--ln);padding:0 4px;border-radius:2px}
.b.on kbd,.b[aria-pressed=true] kbd{color:#444;border-color:#999}
/* header */
.hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--ln);background:var(--p)}
.hd h1{font-size:15px;font-weight:700;margin-right:auto;letter-spacing:.02em}
/* layout */
.app{display:grid;grid-template-columns:150px minmax(0,1fr) 360px;align-items:start}
.nav{display:flex;flex-direction:column;border-right:1px solid var(--ln);position:sticky;top:0;max-height:100vh;overflow:auto}
.nav button{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 10px;background:none;border:0;border-bottom:1px solid var(--ln);text-align:left}
.nav button[aria-pressed=true]{background:var(--hi);color:#111}
.nav button .m{width:7px;height:7px;border-radius:50%;background:transparent}
.nav button.mod .m{background:#cfcfcf}.nav button[aria-pressed=true].mod .m{background:#111}
.mon{padding:10px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0}
.frame{position:relative;background:#000;border:1px solid var(--ln);display:grid;place-items:center;min-height:220px}
.frame canvas{display:block;max-width:100%;max-height:62vh;width:auto;height:auto;cursor:crosshair}
.tag{position:absolute;left:0;top:0;background:#000;color:#bbb;font-size:12px;padding:2px 6px;pointer-events:none}
.mode{position:absolute;left:0;right:0;bottom:0;background:var(--hi);color:#111;font-weight:700;padding:4px 8px;text-align:center;display:none}
.ring{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #fff;outline:1px solid #000;pointer-events:none;display:none}
.wipe{position:absolute;top:0;bottom:0;width:1px;background:#fff;pointer-events:none;display:none}
.vb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vb input[type=range]{flex:1;min-width:90px;accent-color:#ddd}
.vb select{min-height:40px;background:var(--p2);border:1px solid var(--ln);border-radius:2px;padding:0 6px}
.scope{border:1px solid var(--ln);background:#0c0c0c}
.scope canvas{display:block;width:100%;height:auto;max-height:210px;object-fit:contain}
.fcl{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--dim)}
.fcl i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
[hidden]{display:none!important}
/* panel */
.pan{border-left:1px solid var(--ln);min-height:100vh}
.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln);background:var(--p)}
.ph h2{font-size:14px;font-weight:700}
.pb{padding:4px 12px 16px}
.sec{font-size:12px;color:var(--dim);margin:14px 0 4px;border-bottom:1px solid var(--ln);padding-bottom:3px}
.r{display:grid;grid-template-columns:minmax(0,1fr) 70px 32px;gap:6px;align-items:center;padding:6px 0 0}
.r label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.mod label::before{content:"● ";font-size:9px;vertical-align:1px}
.r input[type=number]{height:32px;width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:2px;padding:0 4px;text-align:right;font-size:16px;font-variant-numeric:tabular-nums}
.r .x{height:32px;background:none;border:1px solid var(--ln);border-radius:2px;color:var(--dim)}
.r input[type=range]{grid-column:1/-1;width:100%;height:28px;accent-color:#d0d0d0}
.hue input[type=range]{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00) center/100% 4px no-repeat}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
.inp{width:100%;min-height:40px;background:var(--bg);border:1px solid var(--ln);border-radius:2px;padding:0 8px;font-size:16px}
textarea.inp{min-height:64px;padding:6px 8px;font-size:12px}
.lst{display:flex;flex-direction:column;margin-top:6px;border-top:1px solid var(--ln)}
.lst div{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--ln);padding:4px 0}
.lst span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvw{width:100%;max-width:330px;aspect-ratio:1;margin:8px auto 0;border:1px solid var(--ln)}
.cvw canvas{width:100%;height:100%;display:block;touch-action:none;background:#111;cursor:crosshair}
.sw{display:inline-block;width:18px;height:18px;border:1px solid #000;vertical-align:-4px}
.tl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ba{display:flex;gap:8px;align-items:center;margin-top:8px}
.ba .sw{width:40px;height:24px}
.ck{display:flex;gap:8px;align-items:center;margin-top:8px;min-height:32px}
.ck input{width:18px;height:18px;accent-color:#ddd}
.st{color:var(--dim);font-size:12px;margin-top:8px;min-height:16px}
/* report */
.rep{border-top:1px solid var(--ln);padding:12px 10px 40px}
.rep h2{font-size:14px;margin-bottom:8px}
.rc{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:8px}
.rc label{display:flex;gap:6px;align-items:center}
.rc input[type=number]{width:60px;height:36px;background:var(--bg);border:1px solid var(--ln);border-radius:2px;text-align:right;padding:0 4px;font-size:16px}
.bar{display:flex;height:22px;border:1px solid var(--ln);margin-bottom:10px}.bar div{height:100%}
table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:16px}
th{text-align:left;color:var(--dim);font-weight:400;border-bottom:1px solid var(--ln);padding:4px 6px}
td{border-bottom:1px solid #2c2d2f;padding:4px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
td.n{text-align:right}
.shd{display:flex;gap:2px;min-width:140px}
.shd button{flex-grow:1;flex-basis:0;height:22px;border:1px solid #000;font-size:11px;padding:0}
.tw{overflow-x:auto}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .mon{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 6px 4px;border-bottom:1px solid var(--ln)}
  .frame canvas{max-height:33vh}
  .mon{order:1}.nav{order:2;position:sticky;z-index:4;background:var(--bg);flex-direction:row;overflow-x:auto;max-height:none;border-right:0;border-bottom:1px solid var(--ln)}.pan{order:3}
  kbd{display:none}
  .nav button{border-bottom:0;border-right:1px solid var(--ln);flex:0 0 auto;gap:6px}
  .nav kbd{display:none}
  .pan{border-left:0;min-height:0}
  .scope canvas{max-height:16vh}
}
@media(max-width:560px){.hd h1{width:100%}.hd .b{flex:1 1 auto;padding:0 8px}.vb .b{padding:0 8px}}
</style>
</head>
<body>
<div class="hd">
  <h1>COLOUR SPLITTER PRO</h1>
  <span class="b">Open<input type="file" id="pick" accept="image/*" aria-label="Open image"></span>
  <span class="b">Camera<input type="file" id="cam" accept="image/*" capture="environment" aria-label="Take photo"></span>
  <button class="b" id="undo" disabled title="Undo (Z)">Undo</button>
  <button class="b" id="redo" disabled title="Redo (Y)">Redo</button>
  <button class="b" id="resetAll" title="Reset grade">Reset</button>
  <button class="b on" id="goEx" title="Export (E)">Export LUT</button>
</div>
<div class="app">
  <nav class="nav" id="nav" aria-label="Tools"></nav>
  <div class="mon" id="mon">
    <div class="frame" id="drop">
      <canvas id="view" aria-label="Graded frame. Tap to pick a colour."></canvas>
      <div class="ring" id="ring"></div><div class="wipe" id="wipe"></div>
      <span class="tag" id="tag">SAMPLE FRAME</span>
      <span class="mode" id="mode">TAP SOMETHING WHITE OR GREY · ESC TO CANCEL</span>
    </div>
    <div class="vb">
      <button class="b" id="hold" title="Hold (B)">Before <kbd>B</kbd></button>
      <button class="b" id="vsplit" aria-pressed="false">Split <kbd>S</kbd></button>
      <input type="range" id="wpos" min="0" max="100" value="50" aria-label="Split position" hidden>
      <button class="b" id="vfc" aria-pressed="false">False col <kbd>F</kbd></button>
      <select id="scopeSel" aria-label="Scope"><option value="off">Scope off</option><option value="hist">Histogram</option><option value="wave">Waveform</option><option value="parade">Parade</option><option value="vec">Vectorscope</option></select>
    </div>
    <div class="fcl" id="fcl" hidden>
      <span><i style="background:#7b2cff"></i>&lt;2.5</span><span><i style="background:#1e6bff"></i>2.5–4</span><span><i style="background:#2bd34a"></i>38–42 grey</span><span><i style="background:#ff6fcf"></i>52–56 skin</span><span><i style="background:#ffe600"></i>97–99</span><span><i style="background:#ff1f1f"></i>99+ clip</span><span>IRE</span>
    </div>
    <div class="scope" id="scope"><canvas id="sc" width="512" height="200"></canvas></div>
  </div>
  <section class="pan">
    <div class="ph"><h2 id="pt"></h2><button class="b" id="ptr" title="Reset this tool">Reset tool</button></div>
    <div class="pb" id="panel"></div>
  </section>
</div>
<section class="rep">
  <h2>FRAME REPORT (graded)</h2>
  <div class="rc">
    <label>Shades per colour <input type="number" id="shades" min="1" max="8" value="3"></label>
    <label>Main colours <input type="number" id="mainN" min="3" max="12" value="6"></label>
  </div>
  <div class="bar" id="stack"></div>
  <div class="tw"><table><thead><tr><th>Group</th><th class="n">%</th><th>Shades (tap to edit)</th></tr></thead><tbody id="fam"></tbody></table></div>
  <div class="tw"><table><thead><tr><th></th><th>Name</th><th class="n">%</th><th>HEX</th><th>RGB</th><th>HSL</th><th>CMYK</th><th></th></tr></thead><tbody id="main"></tbody></table></div>
</section>
<script>
{
const $=id=>document.getElementById(id);
const view=$('view'),vctx=view.getContext('2d',{willReadFrequently:true});
let px=[],orig=null,out=null,showOrig=false,REF=null,SRC=null;
const narrow=matchMedia('(max-width:1000px)').matches;
const V={split:false,wp:.5,fc:false,scope:narrow?'off':'hist'};$('scopeSel').value=V.scope;

/* ============ state ============ */
const I2=()=>[[0,0],[1,1]];
const D=()=>({input:'none',match:{on:0,str:100},light:{exp:0,temp:0,tint:0},
  tone:{con:0,piv:45,hi:0,sh:0,wh:0,bl:0},
  prim:{lift:[0,0,0,0],gamma:[0,0,0,0],gain:[0,0,0,0],offset:[0,0,0,0]},
  curves:{m:I2(),r:I2(),g:I2(),b:I2()},col:{sat:0,vib:0,targets:[]},
  split:{sh:200,shs:0,hh:40,hs:0,bal:0},film:{fade:0,bw:0,mr:30,mg:59,mb:11}});
let S=D(),SEL=-1;const DJ=JSON.stringify(D());
const get=(k,o=S)=>k.split('.').reduce((a,p)=>a[p],o);
const set=(k,v)=>{const p=k.split('.'),l=p.pop();p.reduce((a,q)=>a[q],S)[l]=v};
const deep=o=>JSON.parse(JSON.stringify(o));
function mg(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k])mg(a[k],b[k]);else a[k]=deep(b[k])}return a}
let H=[JSON.stringify(S)],HI=0;
function push(){const j=JSON.stringify(S);if(j===H[HI])return;H=H.slice(0,HI+1);H.push(j);if(H.length>80)H.shift();HI=H.length-1;ub()}
function ub(){$('undo').disabled=HI<=0;$('redo').disabled=HI>=H.length-1;markNav()}
function restore(j){S=JSON.parse(j);SEL=Math.min(SEL,S.col.targets.length-1);renderPanel();schedule(true)}
const undo=()=>{if(HI>0){HI--;restore(H[HI]);ub()}},redo=()=>{if(HI<H.length-1){HI++;restore(H[HI]);ub()}};
$('undo').onclick=undo;$('redo').onclick=redo;
$('resetAll').onclick=()=>{const inp=S.input;S=D();S.input=inp;SEL=-1;renderPanel();schedule(true);push()};

/* ============ colour maths ============ */
function hsl01(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
const hsl=(r,g,b)=>hsl01(r/255,g/255,b/255);
function hsl2rgb(h,s,l){h=(((h%360)+360)%360)/360;if(s<=0)return[l,l,l];
  const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q,f=t=>{if(t<0)t+=1;if(t>1)t-=1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};return[f(h+1/3),f(h),f(h-1/3)]}
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const cl=v=>v<0?0:v>1?1:v;
const s2l=c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4,l2s=c=>c<=.0031308?12.92*c:1.055*c**(1/2.4)-.055;
function toLab(r,g,b){r=s2l(r);g=s2l(g);b=s2l(b);const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116,fx=f((.4124*r+.3576*g+.1805*b)/.95047),fy=f(.2126*r+.7152*g+.0722*b),fz=f((.0193*r+.1192*g+.9505*b)/1.08883);return[116*fy-16,500*(fx-fy),200*(fy-fz)]}
function fromLab(L,a,b){const fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200,g=t=>{const c=t*t*t;return c>.008856?c:(t-16/116)/7.787};const X=g(fx)*.95047,Y=g(fy),Z=g(fz)*1.08883;
  return[l2s(cl(3.2406*X-1.5372*Y-.4986*Z)),l2s(cl(-.9689*X+1.8758*Y+.0415*Z)),l2s(cl(.0557*X-.204*Y+1.057*Z))]}
const DEC={
  apple:x=>{const R0=-.05641088,Rt=.01,c=47.28711236,b=.00964052,g=.08550479,B=.69336945,Pt=c*(Rt-R0)**2;return x>=Pt?2**((x-B)/g)-b:x>=0?Math.sqrt(x/c)+R0:R0},
  slog3:x=>x>=171.2102946929/1023?10**((x*1023-420)/261.5)*.19-.01:(x*1023-95)*.01125/(171.2102946929-95),
  vlog:x=>x<.181?(x-.125)/5.6:10**((x-.598206)/.241514)-.00873,
  logc3:x=>x>.1496582?(10**((x-.385537)/.24719)-.052272)/5.555556:(x-.092809)/5.367655};
const INPUTS=[['none','Normal (Rec.709 / photo)'],['apple','Apple Log (iPhone)'],['slog3','Sony S-Log3'],['vlog','Panasonic V-Log'],['logc3','ARRI LogC3']];
const tm=x=>{x=Math.max(0,x)*.6;return((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14))**(1/2.2)};

/* ============ grade (same function feeds preview and .cube) ============ */
let Q={};
function curveTable(pts){const n=pts.length,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),T=new Float32Array(256),d=[],m=[];
  for(let i=0;i<n-1;i++)d[i]=(ys[i+1]-ys[i])/Math.max(1e-6,xs[i+1]-xs[i]);
  m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const t=3/Math.sqrt(s);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}
  let i=0;for(let j=0;j<256;j++){const x=j/255;if(x<=xs[0]){T[j]=ys[0];continue}if(x>=xs[n-1]){T[j]=ys[n-1];continue}
    while(i<n-2&&x>xs[i+1])i++;const h=xs[i+1]-xs[i],t=(x-xs[i])/h,t2=t*t,t3=t2*t;
    T[j]=(2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*h*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*h*m[i+1]}return T}
const isI=p=>p.length===2&&p[0][0]===0&&p[0][1]===0&&p[1][0]===1&&p[1][1]===1;
const cv=(T,x)=>{x=cl(x)*255;const i=x|0;return i>=255?T[255]:T[i]+(T[i+1]-T[i])*(x-i)};
const cvec=(h,a)=>{const c=hsl2rgb(h,1,.5),m=(c[0]+c[1]+c[2])/3;return c.map(v=>(v-m)*a)};
const pv=(v,k)=>[0,1,2].map(i=>(v[i]+v[3])/100*k);
function prep(noInput){const s=S;Q={};Q.id=JSON.stringify(s)===DJ;Q.dec=noInput?null:DEC[s.input]||null;
  if(s.match.on&&REF&&SRC){const k=(r,q)=>Math.min(2.5,Math.max(.4,r/(q||1)));Q.mt={s:s.match.str/100,sL:SRC.m[0],sA:SRC.m[1],sB:SRC.m[2],rL:REF.m[0],rA:REF.m[1],rB:REF.m[2],kL:k(REF.d[0],SRC.d[0]),kA:k(REF.d[1],SRC.d[1]),kB:k(REF.d[2],SRC.d[2])}}
  const L=s.light,e=2**L.exp,t=L.temp/100,ti=L.tint/100;Q.lt=L.exp||t||ti;Q.m=[e*(1+.3*t),e*(1-.3*ti),e*(1-.3*t)];
  const T=s.tone;Q.tn=T.con||T.hi||T.sh||T.wh||T.bl;Q.lo=-T.bl/100*.15;Q.hi=1-T.wh/100*.15;Q.shd=T.sh/100;Q.hil=T.hi/100;Q.k=2**(T.con/100*1.3);Q.p=T.piv/100;
  const W=s.prim;Q.pr=JSON.stringify(W)!==JSON.stringify(D().prim);
  Q.lift=pv(W.lift,.25);Q.gam=pv(W.gamma,.6).map(v=>1/Math.max(.2,1+v));Q.gain=pv(W.gain,.6).map(v=>Math.max(0,1+v));Q.off=pv(W.offset,.15);
  const C=s.curves;Q.cv=!(isI(C.m)&&isI(C.r)&&isI(C.g)&&isI(C.b));if(Q.cv){Q.cm=curveTable(C.m);Q.cr=curveTable(C.r);Q.cg=curveTable(C.g);Q.cb=curveTable(C.b)}
  Q.tg=s.col.targets.filter(t=>t.dh||t.ds||t.dl);Q.vib=s.col.vib/100;Q.sat=s.col.sat/100;
  const P=s.split;Q.sp=P.shs||P.hs;Q.sv=cvec(P.sh,P.shs/100*.28);Q.hv=cvec(P.hh,P.hs/100*.28);Q.bal=P.bal/100;
  const F=s.film;Q.fade=F.fade/100;Q.bw=F.bw;const ms=F.mr+F.mg+F.mb;Q.mx=Math.abs(ms)<1?[.2126,.7152,.0722]:[F.mr/ms,F.mg/ms,F.mb/ms]}
function xf(r,g,b,upto=9){
  if(Q.dec){r=tm(Q.dec(r));g=tm(Q.dec(g));b=tm(Q.dec(b))}
  if(upto<2)return[cl(r),cl(g),cl(b)];

const panel=$('panel');

  if(d.rs){setVal(d.rs,get(d.rs,D()),false);push();return}
  if(d.look)return applyLook(LOOKS[d.look]);

    case'lapply':try{applyLook(JSON.parse($('lpaste').value))}catch(_){$('lpaste').value='Invalid code'}break;
    case'wbpick':setPick(pickMode==='wb'?'hsl':'wb');break;
    case'wbauto':autoWB();break;

    case'cres':S.curves[CH]=I2();drawCurve();schedule(true);push();break;
    case'bwt':S.film.bw=S.film.bw?0:1;renderPanel();schedule(true);push();break;
    case'mon':S.match.on=S.match.on?0:1;renderPanel();schedule(true);push();break;
    case'tdel':S.col.targets.splice(SEL,1);SEL=S.col.targets.length-1;drawTargets();schedule(true);push();break;

/* curves */
let drag=-1;
function drawCurve(){const c=$('cvc');if(!c)return;const x=c.getContext('2d'),W=c.width,col={m:'#ddd',r:'#e55',g:'#5c5',b:'#68f'};
  x.fillStyle='#111';x.fillRect(0,0,W,W);x.strokeStyle='#2a2a2a';x.lineWidth=1;
  for(let i=1;i<4;i++){x.beginPath();x.moveTo(i*W/4+.5,0);x.lineTo(i*W/4+.5,W);x.moveTo(0,i*W/4+.5);x.lineTo(W,i*W/4+.5);x.stroke()}
  x.strokeStyle='#333';x.beginPath();x.moveTo(0,W);x.lineTo(W,0);x.stroke();
  for(const k of['r','g','b','m']){if(k!==CH&&isI(S.curves[k]))continue;const T=curveTable(S.curves[k]);x.strokeStyle=col[k];x.globalAlpha=k===CH?1:.35;x.lineWidth=k===CH?2:1;
    x.beginPath();for(let j=0;j<256;j++){const X=j/255*W,Y=W-T[j]*W;j?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke()}
  x.globalAlpha=1;for(const[a,b]of S.curves[CH]){x.fillStyle='#111';x.strokeStyle=col[CH];x.lineWidth=2;x.fillRect(a*W-5,W-b*W-5,10,10);x.strokeRect(a*W-5,W-b*W-5,10,10)}}
function initCurves(){const c=$('cvc');drawCurve();
  const pos=e=>{const r=c.getBoundingClientRect();return[cl((e.clientX-r.left)/r.width),cl(1-(e.clientY-r.top)/r.height)]};
  const rd=(x,y)=>{$('cvr').textContent=`in ${Math.round(x*255)} → out ${Math.round(y*255)}`};
  c.onpointerdown=e=>{const[x,y]=pos(e),pts=S.curves[CH],tol=18/c.getBoundingClientRect().width;drag=pts.findIndex(p=>Math.hypot(p[0]-x,p[1]-y)<tol);
    if(drag<0){let i=pts.findIndex(p=>p[0]>x);if(i<=0)i=pts.length-1;pts.splice(i,0,[x,y]);drag=i}c.setPointerCapture(e.pointerId);rd(x,y);drawCurve();schedule()};
  c.onpointermove=e=>{if(drag<0)return;const pts=S.curves[CH];let[x,y]=pos(e);
    if(drag===0)x=0;else if(drag===pts.length-1)x=1;else x=Math.min(pts[drag+1][0]-.01,Math.max(pts[drag-1][0]+.01,x));pts[drag]=[x,y];rd(x,y);drawCurve();schedule()};
  c.onpointerup=()=>{if(drag>=0){drag=-1;schedule(true);push()}};
  c.ondblclick=e=>{const[x,y]=pos(e),pts=S.curves[CH],i=pts.findIndex(p=>Math.hypot(p[0]-x,p[1]-y)<.06);if(i>0&&i<pts.length-1){pts.splice(i,1);drawCurve();schedule(true);push()}}}

/* HSL targets */
function drawTargets(){if(!$('tl'))return;prep();const aft=t=>xf(...t.src.map(v=>v/255)).map(v=>v*255);
  $('tl').innerHTML=S.col.targets.length?S.col.targets.map((t,i)=>`<button class="b" data-ti="${i}" aria-pressed="${i===SEL}"><i class="sw" style="background:${hex(t.src)}"></i>${family(t.src)}</button>`).join(''):'<p class="hint">Nothing picked.</p>';
  const t=S.col.targets[SEL];if(!t){$('ed').innerHTML='';return}const a=aft(t);
  const r=(k,l,mn,mx)=>`<div class="r"><label>${l}</label><input type="number" data-tt="${k}" min="${mn}" max="${mx}" value="${t[k]}" aria-label="${l}"><span></span><input type="range" data-tt="${k}" min="${mn}" max="${mx}" value="${t[k]}" aria-label="${l}"></div>`;
  $('ed').innerHTML=`<div class="ba">Before <i class="sw" style="background:${hex(t.src)}"></i> After <i class="sw" style="background:${hex(a)}"></i><button class="b" id="tdel" style="margin-left:auto">Remove</button></div>`+
    r('dh',t.neutral?'Tint hue':'Hue shift °',-180,180)+r('ds','Saturation',-100,100)+r('dl','Lightness',-100,100)+r('range','Range °',8,90)}
function pickTarget(c){const[h,s,l]=hsl(...c),neutral=s<.15||l<.08||l>.94,T=S.col.targets;
  let i=T.findIndex(t=>neutral?t.neutral&&Math.abs(t.l-l)<.15:!t.neutral&&Math.min(Math.abs(t.h-h),360-Math.abs(t.h-h))<14);
  if(i<0){T.push({h,s,l,neutral,range:neutral?40:30,dh:0,ds:0,dl:0,src:c.map(Math.round)});i=T.length-1;push()}SEL=i;openTool('col')}

/* WB / auto */
function setPick(m){pickMode=m;$('mode').style.display=m==='wb'?'block':'none';const b=$('wbpick');if(b)b.setAttribute('aria-pressed',m==='wb')}
function solveWB(c){const R=Math.max(1e-4,c[0])**2.2,G=Math.max(1e-4,c[1])**2.2,B=Math.max(1e-4,c[2])**2.2,t=(B-R)/(.3*(R+B)),mr=1+.3*t,mb=1-.3*t,ti=(1-((R*mr+B*mb)/2)/G)/.3;
  S.light.temp=Math.round(Math.max(-100,Math.min(100,t*100)));S.light.tint=Math.round(Math.max(-100,Math.min(100,ti*100)));if(tool!=='light')openTool('light');else renderPanel();schedule(true);push()}
function stagePx(upto){prep();return px.map(p=>xf(p[0]/255,p[1]/255,p[2]/255,upto))}
function autoWB(){const a=stagePx(2),m=[0,1,2].map(i=>a.reduce((s,p)=>s+p[i],0)/a.length);solveWB(m)}
function autoTone(){const Y=stagePx(3).map(p=>.2126*p[0]+.7152*p[1]+.0722*p[2]).sort((a,b)=>a-b),lo=Y[Math.floor(Y.length*.005)],hi=Y[Math.floor(Y.length*.995)];
  S.tone.bl=Math.round(Math.max(-100,Math.min(100,-lo/.15*100)));S.tone.wh=Math.round(Math.max(-100,Math.min(100,(1-hi)/.15*100)));renderPanel();schedule(true);push()}

function loadRef(f){if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,120/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s)),c=document.createElement('canvas');c.width=w;c.height=h;

/* ============ frame report ============ */
const FAM=['Red','Orange','Yellow','Green','Cyan','Blue','Purple','Pink','Brown','White','Grey','Black'];
const NAMES=[['Black',0,0,0],['White',255,255,255],['Grey',128,128,128],['Silver',192,192,192],['Charcoal',54,69,79],['Red',220,30,40],['Maroon',128,0,0],['Crimson',220,20,60],['Coral',255,127,80],['Salmon',250,128,114],['Orange',255,140,0],['Peach',255,203,164],['Gold',255,200,0],['Yellow',255,235,59],['Cream',255,248,220],['Beige',225,210,180],['Tan',210,180,140],['Brown',120,72,40],['Chocolate',90,50,25],['Olive',128,128,0],['Lime',160,220,40],['Green',40,160,60],['Forest green',34,90,34],['Mint',170,240,200],['Teal',0,128,128],['Cyan',0,200,220],['Sky blue',135,206,235],['Blue',30,90,220],['Navy',20,30,90],['Indigo',75,0,130],['Purple',130,50,170],['Lavender',200,180,240],['Magenta',220,0,180],['Pink',255,150,190],['Rose',230,90,130]];
function family([r,g,b]){const[h,s,l]=hsl(r,g,b);if(l<.12)return'Black';if(l>.9&&s<.35)return'White';if(s<.14||(s<.25&&l<.3))return l>.75?'White':l<.18?'Black':'Grey';
  if(h>=12&&h<48&&l<.42)return'Brown';if(h<12||h>=345)return'Red';if(h<40)return'Orange';if(h<68)return'Yellow';if(h<165)return'Green';if(h<195)return'Cyan';if(h<255)return'Blue';if(h<290)return'Purple';return'Pink'}
const hex=c=>'#'+c.map(v=>Math.round(cl(v/255)*255).toString(16).padStart(2,'0')).join('').toUpperCase();
const lum=c=>(.299*c[0]+.587*c[1]+.114*c[2]),txt=c=>lum(c)>150?'#111':'#fff';
function nameOf(c){let best='',bd=1e9;for(const[n,r,g,b]of NAMES){const d=(c[0]-r)**2*2+(c[1]-g)**2*4+(c[2]-b)**2*3;if(d<bd){bd=d;best=n}}return best}
function cmyk([r,g,b]){const k=1-Math.max(r,g,b)/255;if(k>=1)return[0,0,0,100];return[(1-r/255-k)/(1-k),(1-g/255-k)/(1-k),(1-b/255-k)/(1-k),k].map(v=>Math.round(v*100))}
function kmeans(pts,k){if(!pts.length)return[];k=Math.min(k,pts.length);const so=pts.slice().sort((a,b)=>lum(a)-lum(b));let cen=[];for(let i=0;i<k;i++)cen.push(so[Math.floor((i+.5)*so.length/k)].slice());
  const as=new Int16Array(pts.length);for(let it=0;it<10;it++){const sum=cen.map(()=>[0,0,0,0]);
    for(let i=0;i<pts.length;i++){const p=pts[i];let bi=0,bd=1e9;for(let j=0;j<k;j++){const c=cen[j],d=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2;if(d<bd){bd=d;bi=j}}as[i]=bi;const s=sum[bi];s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];s[3]++}
    cen=cen.map((c,j)=>sum[j][3]?[sum[j][0]/sum[j][3],sum[j][1]/sum[j][3],sum[j][2]/sum[j][3]]:c)}
  const cnt=new Array(k).fill(0);for(let i=0;i<pts.length;i++)cnt[as[i]]++;return cen.map((c,j)=>({c,n:cnt[j]})).filter(x=>x.n>0)}
function analyse(){if(!px.length||!LUT)return;const G=Q.id?px:px.map(p=>sample(p[0],p[1],p[2])),N=G.length,shN=Math.min(8,Math.max(1,+$('shades').value||3)),mainN=Math.min(12,Math.max(3,+$('mainN').value||6));
  const groups={};for(const p of G){const f=family(p);(groups[f]=groups[f]||[]).push(p)}
  const fams=FAM.filter(f=>groups[f]).map(f=>{const g=groups[f],avg=[0,1,2].map(i=>g.reduce((s,p)=>s+p[i],0)/g.length);return{f,n:g.length,avg,sh:kmeans(g,shN).sort((a,b)=>lum(a.c)-lum(b.c))}}).sort((a,b)=>b.n-a.n);
  const pc=n=>n/N*100,fm=v=>v<.1?'<0.1':v.toFixed(1);
  $('stack').innerHTML=fams.map(x=>`<div style="flex:${x.n};background:${hex(x.avg)}" title="${x.f} ${fm(pc(x.n))}%"></div>`).join('');
  $('fam').innerHTML=fams.map(x=>`<tr><td>${x.f}</td><td class="n">${fm(pc(x.n))}</td><td><div class="shd">${x.sh.map(s=>`<button data-c="${s.c.map(Math.round)}" style="flex-grow:${s.n};background:${hex(s.c)};color:${txt(s.c)}" title="${hex(s.c)} · ${fm(pc(s.n))}%">${fm(pc(s.n))}</button>`).join('')}</div></td></tr>`).join('');
  $('main').innerHTML=kmeans(G,mainN).sort((a,b)=>b.n-a.n).map(m=>{const c=m.c.map(Math.round),[h,s,l]=hsl(...c),Hx=hex(c);
    return`<tr><td><i class="sw" style="background:${Hx}"></i></td><td>${nameOf(c)}</td><td class="n">${fm(pc(m.n))}</td><td>${Hx}</td><td>${c.join(',')}</td><td>${Math.round(h)},${Math.round(s*100)},${Math.round(l*100)}</td><td>${cmyk(c).join(',')}</td>
    <td><button class="b" data-cp="${Hx}">Copy</button> <button class="b" data-c="${c}">Edit</button></td></tr>`}).join('')}
const rep=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cp){try{navigator.clipboard.writeText(b.dataset.cp).then(()=>b.textContent='OK',()=>{})}catch(_){}return}
  if(b.dataset.c){pickTarget(b.dataset.c.split(',').map(Number));toPanel()}};
